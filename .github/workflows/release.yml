name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'Release v')
    name: Build for ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            os_name: Windows
          - rid: linux-x64
            os_name: Linux
          - rid: osx-x64
            os_name: macOS-Intel
          - rid: osx-arm64
            os_name: macOS-AppleSilicon

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from commit message
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$COMMIT_MSG" | grep -o 'Release v[0-9a-zA-Z.-]*' | cut -d' ' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish target ${{ matrix.rid }}
        run: dotnet publish PhotoSort.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./publish

      - name: Archive executable (Linux/macOS)
        if: matrix.rid != 'win-x64'
        run: |
          cd publish
          zip -r ../PhotoSort-${{ env.VERSION }}-${{ matrix.rid }}.zip .

      - name: Archive executable (Windows)
        if: matrix.rid == 'win-x64'
        run: |
          cd publish
          zip -r ../PhotoSort-${{ env.VERSION }}-${{ matrix.rid }}.zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: PhotoSort-${{ env.VERSION }}-${{ matrix.rid }}.zip
          generate_release_notes: true
